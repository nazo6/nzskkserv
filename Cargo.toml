[workspace]
resolver = "3"
members = ["nzskkserv-core", "nzskkserv-gui/src-tauri"]

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.43.0" }
tracing = "0.1.41"

[profile]
[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
