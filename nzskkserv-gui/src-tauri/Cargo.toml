[package]
name = "nzskkserv-gui"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "SKK server GUI"

[lib]
name = "nzskkserv_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nzskkserv-core = { path = "../../nzskkserv-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.95"
directories = "6.0.0"
encoding_rs = "0.8.35"
reqwest = { version = "0.13.1", features = ["json"] }
sanitize-filename = "0.6.0"
toml = "0.9.7"
url = { version = "2.5.4", features = ["serde"] }
bounded-vec-deque = "0.1.1"
jiff = { version = "0.2.15", features = ["serde"] }
urlencoding = "2.1.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.0", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
