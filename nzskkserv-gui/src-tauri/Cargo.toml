[package]
name = "nzskkserv-gui"
version = { workspace = true }
edition = { workspace = true }
description = "SKK server GUI"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "nzskkserv_gui_lib"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
encoding_rs = "0.8.42"
jiff = "0.2.38"
nzskkserv-core = { path = "../../nzskkserv-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "json", "system-proxy"] }
sanitize-filename = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
toml = "1.1.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
urlencoding = "2.1.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# v5 に固定: tauri-plugin-single-instance が zbus v5 に依存しているため、
# v6 を使うと zbus/zvariant が二重にリンクされてしまう。
# (single-instance が v6 系に上がったら合わせて更新する)
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console"] }
