[package]
name = "nzskkserv-core"
version = { workspace = true }
edition = { workspace = true }
description = "Library to create skk server."
license = { workspace = true }

documentation = "https://docs.rs/nzskkserv-core/"
readme = "../README.md"
homepage = "https://crates.io/crates/nzskkserv-core"
repository = "https://github.com/nazo6/nzskkserv"

[dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }
tokio-util = { version = "0.7.20", features = ["codec"] }

bytes = "1.12.1"
thiserror = "2.0.21"

encoding_rs = "0.8.42"
tracing = { workspace = true }
