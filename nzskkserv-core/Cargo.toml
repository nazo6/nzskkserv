[package]
name = "nzskkserv-core"
version = { workspace = true }
edition = { workspace = true }
description = "Library to create skk server."
license = { workspace = true }

documentation = "https://docs.rs/nzskkserv-core/"
readme = "../README.md"
homepage = "https://crates.io/crates/nzskkserv-core"
repository = "https://github.com/nazo6/nzskkserv"

[dependencies]
futures = "0.3.31"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7.13", features = ["full"] }

bytes = "1.9.0"
thiserror = "2.0.11"

encoding_rs = "0.8.35"
once_cell = "1.20.2"
tracing = { workspace = true }
urlencoding = "2.1.3"
